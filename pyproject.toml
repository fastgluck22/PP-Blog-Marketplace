[project]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Alsou",email = "fastgluck22@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "categories (>=0.3.8,<0.4.0)",
